<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Mirror - Static Edition</title>
<style>
  :root {
    --bg: #050505;
    --text-main: #ffffff;
    --accent: #ff003c;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #1a1a1a;
    margin: 0;
    padding: 20px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  .social-card {
    position: relative;
    width: 1200px;
    height: 630px;
    background-color: var(--bg);
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    color: var(--text-main);
  }

  /* Base64 encoded SVG static for guaranteed cross-browser rendering */
  .static-noise {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgMjAwIDIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSIzIiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsdGVyPSJ1cmwoI24pIiBvcGFjaXR5PSIxIi8+PC9zdmc+");
    opacity: 0.25;
    animation: jitter 0.2s steps(2) infinite;
    pointer-events: none;
    z-index: 2;
    mix-blend-mode: screen;
  }

  @keyframes jitter {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-2%, 2%); }
    50% { transform: translate(2%, -2%); }
    75% { transform: translate(-2%, -2%); }
    100% { transform: translate(2%, 2%); }
  }

  /* Simplified screen tear */
  .screen-tear {
    position: absolute;
    width: 100%;
    height: 8px;
    background: rgba(255, 255, 255, 0.1);
    top: 50%;
    z-index: 10;
    animation: scanline 4s linear infinite;
    box-shadow: 0 0 10px rgba(255,255,255,0.2);
  }

  @keyframes scanline {
    0% { top: -10%; }
    100% { top: 110%; }
  }

  .content {
    position: relative;
    z-index: 5;
    height: 100%;
    width: 100%;
    display: grid;
    grid-template-columns: 120px 1fr 250px;
  }

  .vertical-title {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 110px;
    font-weight: 900;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.05); /* Safe fallback */
    -webkit-text-stroke: 2px rgba(255, 255, 255, 0.4);
    display: flex;
    align-items: center;
    padding-left: 20px;
    letter-spacing: -5px;
  }

  .main-display {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .title-mirror {
    font-size: 200px;
    font-weight: 900;
    color: var(--text-main);
    line-height: 0.75;
    margin: 0;
    letter-spacing: -12px;
    position: relative;
    left: -40px;
  }

  .accent-block {
    position: absolute;
    background-color: var(--accent);
    color: var(--bg);
    padding: 10px 20px;
    font-weight: bold;
    font-size: 24px;
    letter-spacing: 2px;
    top: 35%;
    left: 45%;
    transform: rotate(-10deg);
    box-shadow: 10px 10px 0px rgba(255,255,255,0.1);
  }

  .data-column {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px 40px 40px 20px;
    font-family: monospace;
    font-size: 14px;
    color: #888;
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    text-align: right;
  }

  /* Modernized glitch text using clip-path */
  .glitch-text {
    position: relative;
    color: white;
    font-weight: bold;
    display: inline-block;
  }
  
  .glitch-text::before {
    content: "NO_SIGNAL";
    position: absolute;
    left: 2px;
    text-shadow: -2px 0 red;
    top: 0;
    color: white;
    background: var(--bg);
    overflow: hidden;
    animation: noise-anim-2 3s infinite linear alternate-reverse;
  }

  @keyframes noise-anim-2 {
    0% { clip-path: inset(65% 0 10% 0); }
    10% { clip-path: inset(20% 0 80% 0); }
    20% { clip-path: inset(70% 0 20% 0); }
    30% { clip-path: inset(10% 0 50% 0); }
    40% { clip-path: inset(50% 0 30% 0); }
    50% { clip-path: inset(90% 0 5% 0); }
    60% { clip-path: inset(30% 0 60% 0); }
    70% { clip-path: inset(80% 0 10% 0); }
    80% { clip-path: inset(5% 0 90% 0); }
    90% { clip-path: inset(40% 0 40% 0); }
    100% { clip-path: inset(60% 0 20% 0); }
  }
</style>
</head>
<body>

<div class="social-card">
  <div class="static-noise"></div>
  <div class="screen-tear"></div>
  
  <div class="content">
    
    <div class="vertical-title">
      BLACK
    </div>

    <div class="main-display">
      <h1 class="title-mirror">MIRROR</h1>
      <div class="accent-block">APP // UI_FAULT</div>
    </div>

    <div class="data-column">
      <div>
        <strong>T_STAMP</strong><br>
        169874.009<br>
        <br>
        <strong>LAT/LON</strong><br>
        ERR_READ
      </div>
      
      <div>
        <span class="glitch-text">NO_SIGNAL</span>
      </div>
    </div>

  </div>
</div>

</body>
</html>
