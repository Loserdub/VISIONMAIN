name: Quality Gate & LAA-v2 Audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Build CSS & Validate Partials
        run: |
          npm run build:css
          python scripts/sync_components.py

      - name: Run Repository Quality Gate & LAA-v2 Audit
        run: python scripts/comprehensive_audit.py
