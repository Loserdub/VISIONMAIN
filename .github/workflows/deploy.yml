# Deploy static site to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build CSS & Validate Partials
        run: |
          npm run build:css
          python scripts/sync_components.py

      - name: Run Repository Quality Gate & LAA-v2 Audit
        run: python scripts/comprehensive_audit.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage Production Site Artifact
        run: |
          rm -rf _site
          mkdir -p _site
          for f in *.html; do
            case "$f" in
              field-notes-*.html|void15new.html) continue ;;
              *) cp "$f" _site/ ;;
            esac
          done
          for f in style.css .nojekyll CNAME robots.txt sitemap.xml llms.txt humans.txt favicon.png bio-avatar.jpg *.txt; do
            [ -f "$f" ] && cp "$f" _site/
          done
          cp -r assets _site/assets
          rm -f _site/assets/*.html
          cp -r void _site/void

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping Search Engines via IndexNow
        continue-on-error: true
        run: python scripts/submit_indexnow.py --force
